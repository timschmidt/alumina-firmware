[workspace]
resolver = "2"
members = [
    "crates/alumina-board",
    "crates/alumina-machine-ir",
    "crates/alumina-protocol",
    "crates/alumina-safety",
    "xtask",
]
default-members = [
    "crates/alumina-board",
    "crates/alumina-machine-ir",
    "crates/alumina-protocol",
    "crates/alumina-safety",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/timschmidt/aluminafw"
publish = false

[workspace.dependencies]
alumina-board = { path = "crates/alumina-board" }
alumina-machine-ir = { path = "crates/alumina-machine-ir" }
alumina-protocol = { path = "crates/alumina-protocol" }
alumina-safety = { path = "crates/alumina-safety" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
alloc_instead_of_core = "warn"
std_instead_of_core = "warn"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
debug = 2
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = true
