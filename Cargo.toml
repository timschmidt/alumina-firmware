[workspace]
resolver = "2"
members = [
    "boards/mks-esp32-foc-v1",
    "boards/mks-tinybee",
    "boards/t-deck-pro",
    "crates/alumina-board",
    "crates/alumina-capability",
    "crates/alumina-clock",
    "crates/alumina-config",
    "crates/alumina-foc",
    "crates/alumina-machine-ir",
    "crates/alumina-motion",
    "crates/alumina-job",
    "crates/alumina-net",
    "crates/alumina-protocol",
    "crates/alumina-runtime",
    "crates/alumina-safety",
    "crates/alumina-service",
    "crates/alumina-sim",
    "crates/alumina-storage",
    "drivers/embedded-bus-async",
    "drivers/alumina-as5600",
    "drivers/alumina-shift-register",
    "drivers/alumina-sd-spi",
    "drivers/sx126x-async-rs",
    "drivers/t-deck-pro-battery-async",
    "drivers/t-deck-pro-epd-async",
    "drivers/t-deck-pro-gps-async",
    "drivers/t-deck-pro-keyboard-async",
    "drivers/t-deck-pro-lora-async",
    "drivers/t-deck-pro-touch-async",
    "examples/i2c-tester",
    "examples/patina",
    "firmware",
    "xtask",
]
default-members = [
    "boards/mks-esp32-foc-v1",
    "boards/mks-tinybee",
    "boards/t-deck-pro",
    "crates/alumina-board",
    "crates/alumina-capability",
    "crates/alumina-clock",
    "crates/alumina-config",
    "crates/alumina-foc",
    "crates/alumina-machine-ir",
    "crates/alumina-motion",
    "crates/alumina-job",
    "crates/alumina-net",
    "crates/alumina-protocol",
    "crates/alumina-runtime",
    "crates/alumina-safety",
    "crates/alumina-service",
    "crates/alumina-sim",
    "crates/alumina-storage",
    "drivers/embedded-bus-async",
    "drivers/alumina-as5600",
    "drivers/alumina-shift-register",
    "drivers/alumina-sd-spi",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/timschmidt/aluminafw"
publish = false

[workspace.dependencies]
alumina-board = { path = "crates/alumina-board" }
alumina-capability = { path = "crates/alumina-capability" }
alumina-clock = { path = "crates/alumina-clock" }
alumina-config = { path = "crates/alumina-config" }
alumina-foc = { path = "crates/alumina-foc" }
alumina-machine-ir = { path = "crates/alumina-machine-ir" }
alumina-motion = { path = "crates/alumina-motion" }
alumina-job = { path = "crates/alumina-job" }
alumina-net = { path = "crates/alumina-net" }
alumina-protocol = { path = "crates/alumina-protocol" }
alumina-runtime = { path = "crates/alumina-runtime" }
alumina-safety = { path = "crates/alumina-safety" }
alumina-service = { path = "crates/alumina-service" }
alumina-sim = { path = "crates/alumina-sim" }
alumina-storage = { path = "crates/alumina-storage" }
alumina-as5600 = { path = "drivers/alumina-as5600" }
alumina-sd-spi = { path = "drivers/alumina-sd-spi" }
alumina-shift-register = { path = "drivers/alumina-shift-register" }
board-mks-tinybee = { path = "boards/mks-tinybee" }
board-mks-esp32-foc-v1 = { path = "boards/mks-esp32-foc-v1" }
board-t-deck-pro = { path = "boards/t-deck-pro" }
bt-hci = "0.6.0"
chrono = { version = "0.4.38", default-features = false, features = ["serde"] }
critical-section = "1.2.0"
defmt = "1.0.1"
embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-futures = "0.1.1"
embassy-net = { version = "0.7.1", features = ["defmt", "dhcpv4", "medium-ethernet", "tcp", "udp"] }
embassy-sync = "0.7.2"
embassy-time = { version = "0.4.0", features = ["defmt"] }
edge-dhcp = { version = "0.6.0", default-features = false, features = ["defmt", "io"] }
edge-http = { version = "0.6.0", default-features = false, features = ["defmt", "io"] }
edge-nal = { version = "0.5.0", default-features = false }
edge-nal-embassy = { version = "0.6.0", default-features = false, features = [
    "defmt",
    "medium-ethernet",
    "proto-ipv4",
    "tcp",
    "udp",
] }
embedded-bus-async = { path = "drivers/embedded-bus-async" }
embedded-graphics = "0.8.1"
embedded-hal = "1.0.0-rc.3"
embedded-hal-async = "1.0.0-rc.3"
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
embedded-io-async-v06 = { package = "embedded-io-async", version = "0.6.1", default-features = false }
esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt"] }
esp-hal = { version = "~1.0", features = ["defmt", "unstable"] }
esp-println = { version = "0.15.0", features = ["log-04", "defmt-espflash"] }
esp-radio = { version = "0.17.0", features = [
    "defmt",
    "esp-alloc",
    "smoltcp",
    "unstable",
    "wifi",
] }
esp-rtos = { version = "0.2.0", features = [
    "defmt",
    "embassy",
] }
heapless = "0.8.0"
hmac = { version = "0.12.1", default-features = false }
log = "0.4.27"
nmea = { version = "0.5.0", default-features = false, features = ["GGA", "RMC", "VTG", "GSA", "GSV", "GLL", "TXT"] }
nb = "1.1.0"
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
sha2 = { version = "0.10.9", default-features = false }
smoltcp = { version = "0.12.0", default-features = false, features = [
    "defmt",
    "medium-ethernet",
    "multicast",
    "proto-dhcpv4",
    "proto-dns",
    "proto-ipv4",
    "socket-dns",
    "socket-icmp",
    "socket-raw",
    "socket-tcp",
    "socket-udp",
] }
static_cell = "2.1.0"
sx126x_async = { path = "drivers/sx126x-async-rs" }
t-deck-pro-keyboard-async = { path = "drivers/t-deck-pro-keyboard-async" }
trouble-host = { version = "0.5.0", features = ["gatt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
alloc_instead_of_core = "warn"
std_instead_of_core = "warn"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
debug = 2
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = true
