name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Permissive dependency and source policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: "1.88.0"
          command: check bans licenses sources

  portable:
    name: Portable checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.88.0
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Portable tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Board registry
        run: |
          cargo xtask board list
          cargo xtask board check mks-tinybee-v1
          cargo xtask board check mks-tinybee-v1-4mb
          cargo xtask board check t-deck-pro
          cargo xtask board check mks-esp32-foc-v1
          cargo xtask board check t-lora-pager-current
          cargo xtask capabilities --board mks-tinybee --json | jq -e '.id == "mks-tinybee-v1" and .armable == false and (.clocks | length == 2) and (.hil_requirements | length == 8)'
          cargo xtask capabilities --board mks-tinybee-4mb --json | jq -e '.id == "mks-tinybee-v1-4mb" and .flash_bytes == 4194304 and .armable == false and .capability_digest_verified == true'
          cargo xtask capabilities --board t-deck-pro --json | jq -e '.id == "t-deck-pro" and .armable == false and (.devices | length == 12) and (.hil_requirements | length == 7)'
