[package]
edition      = "2024"
name = "t-deck-pro-keyboard-async"
rust-version = "1.88"
version      = "0.1.0"
license      = "Apache-2.0"
authors      = ["Gemini", "Marcell Kovacs"]
categories   = ["embedded", "hardware-support", "no-std"]
keywords     = ["esp32", "t-deck", "keyboard", "tca8418"]
description  = "Async no-std TCA8418 keyboard driver for T-Deck Pro"
readme       = "README.md"
repository   = "https://github.com/timschmidt/t-deck-async-drivers-rs"

[[example]]
name = "simple_keyboard"
path = "examples/simple_keyboard.rs"

[dependencies]
embassy-time = { workspace = true }
embedded-hal-async = { workspace = true }
esp-hal = { workspace = true }
heapless = { workspace = true }
log = { workspace = true }

[dev-dependencies]
critical-section = { workspace = true }
embassy-executor = { workspace = true }
embassy-net = { workspace = true }
embedded-io = { workspace = true }
embedded-io-async = { workspace = true }
esp-alloc = { workspace = true }
esp-bootloader-esp-idf = { workspace = true }
esp-rtos = { workspace = true }
esp-println = { workspace = true }
smoltcp = { workspace = true }
static_cell = { workspace = true }
