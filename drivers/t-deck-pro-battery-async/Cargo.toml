[package]
name = "t-deck-pro-battery-async"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Gemini", "Marcell Kovacs"]
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["esp32", "t-deck", "battery", "bq25896"]
description = "Async no-std BQ25896 battery and charger driver for T-Deck Pro"
readme = "README.md"
repository = "https://github.com/timschmidt/t-deck-async-drivers-rs"

[[example]]
name = "simple_battery"
path = "examples/simple_battery.rs"

[dependencies]
embedded-graphics = { workspace = true }
embassy-time = { workspace = true }
embedded-hal-async = { workspace = true }
esp-hal = { workspace = true }
heapless = { workspace = true }
log = { workspace = true }

[dev-dependencies]
critical-section = { workspace = true }
embassy-executor = { workspace = true }
embassy-net = { workspace = true }
embedded-io = { workspace = true }
embedded-io-async = { workspace = true }
esp-alloc = { workspace = true }
esp-bootloader-esp-idf = { workspace = true }
esp-rtos = { workspace = true }
esp-println = { workspace = true }
smoltcp = { workspace = true }
static_cell = { workspace = true }
