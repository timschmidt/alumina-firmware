[workspace]
resolver = "2"

[package]
name = "alumina-brotli-decoder"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
brotli-decompressor = { version = "=5.0.3", default-features = true }
wasm-bindgen = "=0.2.122"

[dev-dependencies]
brotli = "=8.0.2"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
