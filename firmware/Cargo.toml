[package]
name = "alumina-firmware"
description = "Dual-core Embassy composition root for Alumina ESP32 boards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "alumina-firmware"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
board-mks-tinybee = [
    "dep:board-mks-tinybee",
    "esp-bootloader-esp-idf/esp32",
    "esp-hal/esp32",
    "esp-rtos/esp32",
]
board-t-deck-pro = [
    "dep:board-t-deck-pro",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
]

[dependencies]
alumina-board.workspace = true
alumina-protocol.workspace = true
alumina-runtime.workspace = true
board-mks-tinybee = { workspace = true, optional = true }
board-t-deck-pro = { workspace = true, optional = true }
defmt.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
esp-bootloader-esp-idf.workspace = true
esp-hal.workspace = true
esp-rtos.workspace = true
panic-rtt-target.workspace = true
rtt-target.workspace = true
static_cell.workspace = true

[lints]
workspace = true
