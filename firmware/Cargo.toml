[package]
name = "alumina-firmware"
description = "Dual-core Embassy composition root for Alumina ESP32 boards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "alumina-firmware"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "alumina-hil-mks-tinybee-pcm-short-safe"
path = "src/hil_mks_tinybee_pcm_short_safe.rs"
test = false
bench = false
required-features = ["hil-mks-tinybee-pcm-short-safe"]

[[bin]]
name = "alumina-hil-mks-tinybee-graph-input-timing-safe"
path = "src/hil_mks_tinybee_graph_input_timing_safe.rs"
test = false
bench = false
required-features = ["hil-mks-tinybee-graph-input-timing-safe"]

[[bin]]
name = "alumina-hil-mks-tinybee-wifi-radio-safe"
path = "src/hil_mks_tinybee_wifi_radio_safe.rs"
test = false
bench = false
required-features = ["hil-mks-tinybee-wifi-radio-safe"]

[features]
default = []
board-mks-tinybee = [
    "dep:board-mks-tinybee",
    "alumina-esp-radio-audit/esp32",
    "alumina-xtensa-stack-watermark/esp32",
    "esp-alloc/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-hal/esp32",
    "esp-radio/esp32",
    "esp-rtos/esp-alloc",
    "esp-rtos/esp32",
    "esp-rtos/esp-radio",
    "esp-rtos/radio-tasks-core0",
]
board-mks-tinybee-4mb = [
    "dep:board-mks-tinybee",
    "alumina-esp-radio-audit/esp32",
    "alumina-xtensa-stack-watermark/esp32",
    "esp-alloc/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-hal/esp32",
    "esp-radio/esp32",
    "esp-rtos/esp-alloc",
    "esp-rtos/esp32",
    "esp-rtos/esp-radio",
    "esp-rtos/radio-tasks-core0",
]
board-mks-esp32-foc-v1 = [
    "dep:board-mks-esp32-foc-v1",
    "alumina-esp-radio-audit/esp32",
    "alumina-xtensa-stack-watermark/esp32",
    "esp-alloc/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-hal/esp32",
    "esp-radio/esp32",
    "esp-rtos/esp-alloc",
    "esp-rtos/esp32",
    "esp-rtos/esp-radio",
    "esp-rtos/radio-tasks-core0",
]
board-t-deck-pro = [
    "dep:board-t-deck-pro",
    "alumina-esp-radio-audit/esp32s3",
    "alumina-xtensa-stack-watermark/esp32s3",
    "esp-alloc/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-hal/esp32s3",
    "esp-radio/esp32s3",
    "esp-rtos/esp-alloc",
    "esp-rtos/esp32s3",
    "esp-rtos/esp-radio",
    "esp-rtos/radio-tasks-core0",
]
board-t-lora-pager = [
    "dep:board-t-lora-pager",
    "alumina-esp-radio-audit/esp32s3",
    "alumina-xtensa-stack-watermark/esp32s3",
    "esp-alloc/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-hal/esp32s3",
    "esp-radio/esp32s3",
    "esp-rtos/esp-alloc",
    "esp-rtos/esp32s3",
    "esp-rtos/esp-radio",
    "esp-rtos/radio-tasks-core0",
]
hil-mks-tinybee-pcm-short-safe = ["board-mks-tinybee"]
hil-mks-tinybee-graph-input-timing-safe = ["board-mks-tinybee"]
hil-mks-tinybee-wifi-radio-safe = ["board-mks-tinybee"]
task-context-diagnostics = ["esp-rtos/task-diagnostics"]
radio-driver-diagnostics = [
    "dep:log",
    "dep:esp-radio-rtos-driver",
    "esp-println-uart/log-04",
    "esp-radio/log-04",
    "esp-radio-rtos-driver/log-04",
    "esp-radio/print-logs-from-driver",
]
# Physical commissioning aid: preserve the production composition but hold the
# core-0 service task before SD discovery long enough to observe the recovery
# AP. This is opt-in and never selected by a board's normal build profile.
diagnostic-pre-storage-network-window = []

[dependencies]
alumina-board.workspace = true
alumina-as5600.workspace = true
alumina-esp-radio-audit.workspace = true
alumina-capability.workspace = true
alumina-clock.workspace = true
alumina-config.workspace = true
alumina-diagnostics.workspace = true
alumina-foc.workspace = true
alumina-graph-ir.workspace = true
alumina-job.workspace = true
alumina-machine-ir.workspace = true
alumina-motion.workspace = true
alumina-net.workspace = true
alumina-protocol.workspace = true
alumina-runtime.workspace = true
alumina-safety.workspace = true
alumina-sd-spi.workspace = true
alumina-shift-register.workspace = true
alumina-service.workspace = true
alumina-storage.workspace = true
alumina-web-assets.workspace = true
alumina-xtensa-stack-watermark.workspace = true
board-mks-tinybee = { workspace = true, optional = true }
board-mks-esp32-foc-v1 = { workspace = true, optional = true }
board-t-deck-pro = { workspace = true, optional = true }
board-t-lora-pager = { workspace = true, optional = true }
defmt.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-net.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
edge-dhcp.workspace = true
edge-http.workspace = true
edge-nal.workspace = true
edge-nal-embassy.workspace = true
embedded-io-async-v06.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true
esp-alloc.workspace = true
esp-bootloader-esp-idf.workspace = true
esp-hal.workspace = true
esp-radio.workspace = true
esp-radio-rtos-driver = { workspace = true, optional = true }
esp-rtos.workspace = true
heapless.workspace = true
log = { workspace = true, optional = true }
nb.workspace = true
panic-rtt-target.workspace = true
pin-project-lite.workspace = true
rtt-target.workspace = true
static_cell.workspace = true

[target.xtensa-esp32-none-elf.dependencies]
esp-println-uart = { package = "esp-println", version = "0.17.0", default-features = false, features = [
    "critical-section",
    "defmt-espflash",
    "esp32",
    "uart",
] }

[target.xtensa-esp32s3-none-elf.dependencies]
esp-println-uart = { package = "esp-println", version = "0.17.0", default-features = false, features = [
    "critical-section",
    "defmt-espflash",
    "esp32s3",
    "uart",
] }

[lints]
workspace = true
